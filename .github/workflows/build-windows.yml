# Build do `anna.exe` no Windows (runner com toolchain MSVC — onde as deps de
# TLS com código C/assembly, via rustls/aws-lc-rs, compilam). Serve para: (a)
# provar que o anna compila no Windows a cada mudança; (b) publicar o anna.exe
# como artefato pro empacotamento do ShvIA Desktop (ver SHVIA-DESKTOP: a ponte
# do Modo Code no WebView2 procura o anna.exe no PATH / ao lado do app).
#
# As `uses:` são pinadas por **SHA de commit**, não por tag (achado F-09). Tag do
# GitHub Actions é ponteiro móvel: `@v4` continua apontando para o que o dono do
# repositório mandar amanhã, e um `uses:` roda com as permissões deste workflow.
# O comentário ao lado de cada SHA diz qual versão ele é, para a subida ser uma
# decisão e não um efeito. Para conferir ou subir um pin:
#
#   gh api repos/<dono>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
#   # tag anotada devolve type=tag: resolva com
#   gh api repos/<dono>/<repo>/git/tags/<sha> --jq '.object.sha'
#
# `dtolnay/rust-toolchain` não tem tag — `stable` é BRANCH. O SHA congela o código
# da action, não a versão do Rust: ela continua instalando o stable do dia.

name: build-windows

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      # 🔴 `version.md` no gatilho, e não é detalhe: a `build.rs` DERRUBA o build quando os
      # três portadores divergem, e as versões 0.11.5 e 0.11.6 mexeram só neste arquivo —
      # então o commit que quebrou o `master` foi exatamente o que não acordou o CI. Duas
      # versões sem compilar, sem um X vermelho em lugar nenhum (achado F-01).
      - 'version.md'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain Rust (MSVC)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch stable em 05/08/2026
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache do cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Antes do build, o barato: `--locked` recusa mexer no lock (é ele que guarda o
      # lockfile de verdade, como a `build.rs` explica), `clippy` e os 63 testes. Um build
      # de release leva minutos; um teste quebrado que só aparece depois dele custa a
      # rodada inteira.
      - name: Testes e clippy
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings

      # RustSec advisories (achados DEP-3 / F-31). O `deny.toml` deste repositório passa com
      # a lista de exceções VAZIA, e esse é o estado desejado — os dois repos Tauri precisam
      # de dezesseis exceções documentadas por causa da árvore GTK3 deles, e este não precisa
      # de nenhuma. Se um dia precisar, a exceção vem com o motivo escrito.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Sanidade (--version)
        run: .\target\x86_64-pc-windows-msvc\release\anna.exe --version

      # Checksum ao lado do binário, no formato que o `sha256sum -c` lê — o mesmo
      # que o `release-manifest.mjs` do SHVIA-DESKTOP já gera para os instaladores.
      # Sem ele, quem baixa o artefato para empacotar o desktop não tem como dizer
      # se o que chegou é o que saiu daqui (achado F-09).
      - name: Checksum do anna.exe
        shell: pwsh
        run: |
          $dir = "target/x86_64-pc-windows-msvc/release"
          $hash = (Get-FileHash "$dir/anna.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  anna.exe" | Set-Content -NoNewline -Encoding ascii "$dir/anna.exe.sha256"
          Get-Content "$dir/anna.exe.sha256"

      - name: Publica o anna.exe como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anna-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/anna.exe
            target/x86_64-pc-windows-msvc/release/anna.exe.sha256
          if-no-files-found: error
