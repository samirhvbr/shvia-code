[package]
name = "anna"
# Mantida em sincronia com version.md (fonte da verdade). Quem CHECA é o `build.rs`
# deste repo — o comentário antigo dizia "o build-local.sh checa" e isso era falso
# (medido em 20/08: aquele script só olha o version.md do próprio desktop), que é
# como o bump da 0.11.2 saiu pela metade sem nada acusar.
version = "0.11.33"
edition = "2021"
description = "Anna — CLI agêntico de código da Blue3, sobre o gateway do ShvIA (SHVIA-CODE)"
authors = ["Samir Hanna Verza <samirhv@me.com>"]
license = "UNLICENSED"

[[bin]]
name = "anna"
path = "src/main.rs"

# C1 (MVP leitura): loop agêntico + tools read-only + REPL. Conjunto completo e
# rationale em docs/arquitetura-cli.md §3. Escrita/bash/git entram no C2.
[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "14"
ignore = "0.4"          # walk respeitando .gitignore (list/grep/glob) — engine do ripgrep
regex = "1"             # grep
globset = "0.4"         # glob
directories = "5"       # ~/.config, ~/.local/share corretos por SO
toml = "0.8"            # config file
similar = "2"           # diff unificado (preview de edit_file/write_file — C2)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }  # datas/hora LOCAL do dashboard (anna stats)

# Windows-only: the Job Object that lets the bash time ceiling kill a whole process tree
# (src/tools.rs, `Arvore`). Already in the dependency tree through tokio/mio; 0.59 is the
# version the lockfile already carries.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

# Espelha o perfil do SHVIA-DESKTOP: binário menor e mais rápido pro release
# distribuído (o dia a dia de dev usa `cargo build` normal, perfil dev intacto).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
