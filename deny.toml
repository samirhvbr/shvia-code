# cargo-deny — RustSec advisories for this crate's dependency tree.
#
# Findings DEP-3 / F-31 of the September 2026 technical review: none of the three Rust
# repositories measured advisories.
#
# This one passes with an EMPTY ignore list, and that is the desired state — not a
# placeholder. `anna` has a small dependency tree and no GUI toolkit, which is why the two
# Tauri repositories need sixteen documented exceptions and this one needs none.
#
# An entry in `ignore` is a debt with a WRITTEN reason and a way to re-check it. "We'll look
# later" is not a reason.
#
# Run: cargo deny check advisories

[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0",
    "OpenSSL", "Unlicense", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
